services:

  proxy:
    image: traefik:v3.7
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --accesslog
      - --log

  db:
    image: postgres:18
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d app
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app
    ports:
      - "5433:5432"

  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - "1025:1025"
      - "8026:8025"

  adminer:
    image: adminer
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      - traefik.enable=true
      - traefik.http.routers.adminer-http.rule=Host(`adminer.${DOMAIN:-localhost}`)
      - traefik.http.routers.adminer-http.entrypoints=http
      - traefik.http.services.adminer.loadbalancer.server.port=8080

  backend:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
      mailpit:
        condition: service_started
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      FASTAPI_ENV: ${FASTAPI_ENV:-production}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      SENTRY_DSN: ${SENTRY_DSN:-}

    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/api/v1/utils/health-check/
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
      - "8001:8000"
    labels:
      - traefik.enable=true
      - traefik.http.services.backend.loadbalancer.server.port=8000
      - traefik.http.routers.backend-http.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.backend-http.entrypoints=http
      # Apply a shared edge limit before requests reach any backend worker.
      - traefik.http.middlewares.public-lookup-ratelimit.ratelimit.average=12
      - traefik.http.middlewares.public-lookup-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.public-lookup-ratelimit.ratelimit.burst=12
      - traefik.http.routers.public-student-qr-http.rule=Host(`${DOMAIN:-localhost}`) && Path(`/api/v1/public/student-qr`)
      - traefik.http.routers.public-student-qr-http.entrypoints=http
      - traefik.http.routers.public-student-qr-http.priority=100
      - traefik.http.routers.public-student-qr-http.service=backend
      - traefik.http.routers.public-student-qr-http.middlewares=public-lookup-ratelimit
      - traefik.http.routers.public-credential-lookup-http.rule=Host(`${DOMAIN:-localhost}`) && PathPrefix(`/api/v1/attendee-credentials/public/`)
      - traefik.http.routers.public-credential-lookup-http.entrypoints=http
      - traefik.http.routers.public-credential-lookup-http.priority=100
      - traefik.http.routers.public-credential-lookup-http.service=backend
      - traefik.http.routers.public-credential-lookup-http.middlewares=public-lookup-ratelimit
      # Rate-limit credential stuffing and password-reset email abuse at the edge.
      - traefik.http.middlewares.login-ratelimit.ratelimit.average=10
      - traefik.http.middlewares.login-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.login-ratelimit.ratelimit.burst=10
      - traefik.http.middlewares.password-recovery-ratelimit.ratelimit.average=3
      - traefik.http.middlewares.password-recovery-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.password-recovery-ratelimit.ratelimit.burst=3
      - traefik.http.routers.login-http.rule=Host(`${DOMAIN:-localhost}`) && Path(`/api/v1/login/access-token`)
      - traefik.http.routers.login-http.entrypoints=http
      - traefik.http.routers.login-http.priority=100
      - traefik.http.routers.login-http.service=backend
      - traefik.http.routers.login-http.middlewares=login-ratelimit
      - traefik.http.routers.password-recovery-http.rule=Host(`${DOMAIN:-localhost}`) && PathPrefix(`/api/v1/password-recovery/`)
      - traefik.http.routers.password-recovery-http.entrypoints=http
      - traefik.http.routers.password-recovery-http.priority=100
      - traefik.http.routers.password-recovery-http.service=backend
      - traefik.http.routers.password-recovery-http.middlewares=password-recovery-ratelimit

volumes:
  app-db-data:
