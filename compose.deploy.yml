services:

  proxy:
    restart: always
    ports:
      # Listen on port 80, default for HTTP, necessary to redirect to HTTPS
      - "80:80"
      # Listen on port 443, default for HTTPS
      - "443:443"
    volumes:
      # Mount the volume to store the certificates
      - traefik-certificates:/certificates
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Redirect all HTTP traffic to HTTPS
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Store the Let's Encrypt certificates in the mounted volume
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      # Use the TLS Challenge for Let's Encrypt
      - --certificatesresolvers.le.acme.tlschallenge=true
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log

  db:
    restart: always
    # Production PostgreSQL must only be reachable on the internal Compose network.
    ports: !reset []

  adminer:
    restart: always
    labels:
      # Route HTTPS traffic for the Adminer subdomain
      - traefik.http.routers.adminer-https.rule=Host(`adminer.${DOMAIN:?Variable not set}`)
      - traefik.http.routers.adminer-https.entrypoints=https
      - traefik.http.routers.adminer-https.tls=true
      # Use the Let's Encrypt resolver
      - traefik.http.routers.adminer-https.tls.certresolver=le

  backend:
    restart: always
    # The production backend must only be reachable through the rate-limited proxy.
    ports: !reset []
    environment:
      FRONTEND_HOST: https://${DOMAIN:?Variable not set}
    labels:
      # Route HTTPS traffic for this domain
      - traefik.http.routers.backend-https.rule=Host(`${DOMAIN:?Variable not set}`)
      - traefik.http.routers.backend-https.entrypoints=https
      - traefik.http.routers.backend-https.tls=true
      # Use the Let's Encrypt resolver
      - traefik.http.routers.backend-https.tls.certresolver=le
      # Higher-priority routers rate-limit public identity/credential lookups
      # at the edge, shared across backend workers and independent of XFF input.
      - traefik.http.routers.public-student-qr-https.rule=Host(`${DOMAIN:?Variable not set}`) && Path(`/api/v1/public/student-qr`)
      - traefik.http.routers.public-student-qr-https.entrypoints=https
      - traefik.http.routers.public-student-qr-https.priority=100
      - traefik.http.routers.public-student-qr-https.tls=true
      - traefik.http.routers.public-student-qr-https.tls.certresolver=le
      - traefik.http.routers.public-student-qr-https.service=backend
      - traefik.http.routers.public-student-qr-https.middlewares=public-lookup-ratelimit
      - traefik.http.routers.public-credential-lookup-https.rule=Host(`${DOMAIN:?Variable not set}`) && PathPrefix(`/api/v1/attendee-credentials/public/`)
      - traefik.http.routers.public-credential-lookup-https.entrypoints=https
      - traefik.http.routers.public-credential-lookup-https.priority=100
      - traefik.http.routers.public-credential-lookup-https.tls=true
      - traefik.http.routers.public-credential-lookup-https.tls.certresolver=le
      - traefik.http.routers.public-credential-lookup-https.service=backend
      - traefik.http.routers.public-credential-lookup-https.middlewares=public-lookup-ratelimit
      - traefik.http.routers.signup-https.rule=Host(`${DOMAIN:?Variable not set}`) && Path(`/api/v1/users/signup`)
      - traefik.http.routers.signup-https.entrypoints=https
      - traefik.http.routers.signup-https.priority=100
      - traefik.http.routers.signup-https.tls=true
      - traefik.http.routers.signup-https.tls.certresolver=le
      - traefik.http.routers.signup-https.service=backend
      - traefik.http.routers.signup-https.middlewares=signup-ratelimit
      - traefik.http.routers.login-https.rule=Host(`${DOMAIN:?Variable not set}`) && Path(`/api/v1/login/access-token`)
      - traefik.http.routers.login-https.entrypoints=https
      - traefik.http.routers.login-https.priority=100
      - traefik.http.routers.login-https.tls=true
      - traefik.http.routers.login-https.tls.certresolver=le
      - traefik.http.routers.login-https.service=backend
      - traefik.http.routers.login-https.middlewares=login-ratelimit
      - traefik.http.routers.password-recovery-https.rule=Host(`${DOMAIN:?Variable not set}`) && PathPrefix(`/api/v1/password-recovery/`)
      - traefik.http.routers.password-recovery-https.entrypoints=https
      - traefik.http.routers.password-recovery-https.priority=100
      - traefik.http.routers.password-recovery-https.tls=true
      - traefik.http.routers.password-recovery-https.tls.certresolver=le
      - traefik.http.routers.password-recovery-https.service=backend
      - traefik.http.routers.password-recovery-https.middlewares=password-recovery-ratelimit

volumes:
  # Create a volume to store the certificates, even if the container is recreated
  traefik-certificates:
