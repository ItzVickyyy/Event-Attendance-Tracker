name: Format backend once

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/academic-year-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Format backend
        working-directory: backend
        run: uv run ruff format app tests
      - name: Commit formatted backend
        run: |
          if git diff --quiet; then
            echo "Backend already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app backend/tests
          git commit -m "style: format backend"
          git push origin HEAD:${{ github.head_ref }}
      - name: Remove one-time formatter workflow
        if: success()
        run: |
          git pull --rebase origin ${{ github.head_ref }}
          git rm .github/workflows/format-backend-once.yml
          git commit -m "chore: remove one-time formatter workflow"
          git push origin HEAD:${{ github.head_ref }}
